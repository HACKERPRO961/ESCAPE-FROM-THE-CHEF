name: Release AAB (Play Store)
# Play Console'a yüklenecek imzalı .aab dosyasını üretir. Elle çalıştır (Actions > Release AAB > Run workflow).
# Gerekli GitHub Secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD  (docs/PLAY_STORE.md)
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Sürüm adı (örn. 1.4.0)"
        default: "1.4.0"
      version_code:
        description: "Sürüm kodu (her yüklemede artmalı; boşsa run numarası)"
        default: ""
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Anahtar deposunu hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 secret tanımlı değil (docs/PLAY_STORE.md)"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "KS_PATH=$RUNNER_TEMP/upload.keystore" >> $GITHUB_ENV
      - run: npm install
      - run: npm run iap
      - run: npx cap add android
      - name: Android ayarları
        env:
          SIGN: "1"
          VERSION_CODE: ${{ inputs.version_code || github.run_number }}
          VERSION_NAME: ${{ inputs.version_name }}
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ADMOB_REWARDED_ID: ${{ vars.ADMOB_REWARDED_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ vars.ADMOB_INTERSTITIAL_ID }}
          ADMOB_FORCE_TEST: ${{ vars.ADMOB_FORCE_TEST }}
        run: python3 scripts/android-setup.py
      - name: Gerçek reklam kimliği kontrolü
        run: |
          if [ -z "${{ vars.ADMOB_APP_ID }}" ]; then echo "::warning::ADMOB_APP_ID tanımlı değil, TEST reklamları kullanılacak. Play'e yüklemeden önce gerçek kimlikleri ekle."; fi
      - name: Icons
        continue-on-error: true
        run: npx -y @capacitor/assets generate --android
      - run: npx cap sync android
      - name: Build AAB
        working-directory: android
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: escape-from-the-chef-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
