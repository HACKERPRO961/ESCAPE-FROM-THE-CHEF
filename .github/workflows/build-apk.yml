name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - name: Portrait mode
        run: sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
      - name: Version code
        run: sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
      - name: Icons
        continue-on-error: true
        run: npx -y @capacitor/assets generate --android
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk escape-from-the-chef.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Android APK ${{ github.run_number }}
          files: escape-from-the-chef.apk
          make_latest: true
