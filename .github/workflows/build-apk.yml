name: Build Android APK (test)
# Arkadaşlara dağıtmak için hızlı test APK'sı. Play Store için "Release AAB" iş akışını kullan.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run iap
      - run: npx cap add android
      - name: Android ayarları
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.4.0
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ADMOB_REWARDED_ID: ${{ vars.ADMOB_REWARDED_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ vars.ADMOB_INTERSTITIAL_ID }}
        run: python3 scripts/android-setup.py
      - name: Icons
        continue-on-error: true
        run: npx -y @capacitor/assets generate --android
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk escape-from-the-chef.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Android APK ${{ github.run_number }}
          files: escape-from-the-chef.apk
          make_latest: true
