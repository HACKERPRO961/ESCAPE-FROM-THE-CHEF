name: Deploy site
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://hackerpro961.github.io/ESCAPE-FROM-THE-CHEF-indirme-sitesi-/
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir _site
          cp -r site/* _site/
          mkdir _site/play
          cp -r www/* _site/play/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: d
        uses: actions/deploy-pages@v4
